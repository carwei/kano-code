<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Kano Pixel Kit Editor</title>
    <script src="../../node_modules/@webcomponents/shadycss/apply-shim.min.js"></script>
    <script src="../../node_modules/@webcomponents/shadycss/scoping-shim.min.js"></script>
    <script src="../../node_modules/@webcomponents/webcomponentsjs/webcomponents-bundle.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d1a;
        }
        kano-app-editor {
            width: 100%;
            height: 100%;
        }
        .browser-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 20px;
            background: #F44336;
            color: white;
            text-align: center;
            z-index: 10000;
        }
        .browser-warning.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="browser-warning" id="browser-warning">
        <strong>Web Serial API not supported.</strong>
        Please use <a href="https://www.google.com/chrome/" style="color: white;">Google Chrome</a>
        or <a href="https://www.microsoft.com/edge" style="color: white;">Microsoft Edge</a>
        to connect to your Pixel Kit via USB.
    </div>
    <script src="./index.js" type="module"></script>
</body>
</html>
